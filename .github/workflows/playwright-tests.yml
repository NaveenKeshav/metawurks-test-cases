name: Run Playwright Tests

on:
  push:
    branches: [ main, Basic-testcases ]
  pull_request:
    branches: [ main, Basic-testcases ]
  schedule:
    - cron: '0 6 * * *'  # Run daily at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: metawurks/metawurks-test-cases
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }}

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL || 'https://metawurks.com/' }}" >> .env
          echo "APP_URL=${{ secrets.APP_URL || 'https://metawurks.com/app' }}" >> .env
          echo "LOGIN_USERNAME=${{ secrets.LOGIN_USERNAME || 'naveen.keshav@metadottech.com' }}" >> .env
          echo "LOGIN_PASSWORD=${{ secrets.LOGIN_PASSWORD || '50umyaComputer!' }}" >> .env
          echo "NAVIGATION_TIMEOUT=${{ secrets.NAVIGATION_TIMEOUT || '30000' }}" >> .env
          echo "ELEMENT_TIMEOUT=${{ secrets.ELEMENT_TIMEOUT || '10000' }}" >> .env
          echo "VIEWPORT_WIDTH=${{ secrets.VIEWPORT_WIDTH || '1280' }}" >> .env
          echo "VIEWPORT_HEIGHT=${{ secrets.VIEWPORT_HEIGHT || '900' }}" >> .env

      - name: Run Playwright tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30