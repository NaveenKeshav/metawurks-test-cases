name: Run Playwright Tests

on:
  push:
    branches: [ main, Basic-testcases ]
  pull_request:
    branches: [ main, Basic-testcases ]
  schedule:
    - cron: '0 6 * * *'  # Run daily at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }}

      - name: Run Playwright tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }} --reporter=line,html
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://metawurks.com/' }}
          APP_URL: ${{ secrets.APP_URL || 'https://metawurks.com/app' }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          NAVIGATION_TIMEOUT: ${{ secrets.NAVIGATION_TIMEOUT || '30000' }}
          ELEMENT_TIMEOUT: ${{ secrets.ELEMENT_TIMEOUT || '10000' }}
          VIEWPORT_WIDTH: ${{ secrets.VIEWPORT_WIDTH || '1280' }}
          VIEWPORT_HEIGHT: ${{ secrets.VIEWPORT_HEIGHT || '900' }}
          WORKER_COUNT: ${{ secrets.WORKER_COUNT || '4' }}
          RETRY_COUNT: ${{ secrets.RETRY_COUNT || '1' }}

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30